title: "视觉排序器"
type: community
group: 生成式AI
order: 5
image: /static/templates/visual-ranker.png
details: |
  <h1>对LLM生成的视觉结果进行排名</h1>
  <dl>
    <dt>行业应用</dt>
    <dd>图像评估、视觉搜索、AI图像评估、生成AI评估</dd>
    <dt>相关模型</dt>
    <dd>CLIP、DALL-E评估、视觉模型</dd>
    <dt>领域术语</dt>
    <dd>视觉排序、图像评估、生成AI、T2I评估</dd>
  </dl>
config: |
  <View>
        <Style>
          .product-panel {
            display: flex;
            align-items: center;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.1);
            padding: 20px;
            border-radius: 10px;
            background-color: #f8f8f8;
            font-size: 1.3em;
            transition: transform .2s; 
            color: #333;
          }
        
          .product-panel:hover {
            transform: scale(1.01);
          }
          .htx-ranker-item { padding: 0; border: 0; align-self: center; }
          .htx-ranker-item img { width: 100%; }
          .htx-ranker-item [class^=itemLine]:last-child { display: none }
        </Style>
  
     <View className="product-panel">
        <Text name="prompt" value="$prompt"/>
      </View>
      <View>
        <List name="generated_images" value="$images" title="Generated Images" />
        <Ranker name="rank" toName="generated_images">
    </Ranker> 
      </View>
    </View>
