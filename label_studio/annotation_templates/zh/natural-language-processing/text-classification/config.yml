title: "文本分类"
type: community
group: 自然语言处理
order: 2
image: /static/templates/text-classification.png
details: |
  <h1>对文本进行分类</h1>
  <dl>
    <dt>行业应用</dt>
    <dd>社交媒体监测、客户反馈分析、产品评论、品牌情感追踪、市场研究、政治情感、新闻情感、电商评论、客户满意度、社交聆听、声誉管理、调查分析</dd>
    <dt>相关模型</dt>
    <dd>BERT、RoBERTa、DistilBERT、支持向量机、朴素贝叶斯、XGBoost</dd>
    <dt>领域术语</dt>
    <dd>NLP、情感分析、观点挖掘、品牌监测、情绪检测、评论分析</dd>
  </dl>
config: |
  <View>
    <Text name="text" value="$text"/>
    <View style="box-shadow: 2px 2px 5px #999;
                 padding: 20px; margin-top: 2em;
                 border-radius: 5px;">
      <Header value="Choose text sentiment"/>
      <Choices name="sentiment" toName="text"
               choice="single" showInLine="true">
        <Choice value="Positive"/>
        <Choice value="Negative"/>
        <Choice value="Neutral"/>
      </Choices>
    </View>
  </View>

