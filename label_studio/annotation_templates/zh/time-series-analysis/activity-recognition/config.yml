title: "活动识别"
type: community
group: 时间序列分析
image: /static/templates/activity-recognition.png
details: |
  <h1>从时间序列数据中识别活动</h1>
  <dl>
    <dt>行业应用</dt>
    <dd>可穿戴设备、健康监测、运动追踪、行为分析、智能家居</dd>
    <dt>相关模型</dt>
    <dd>LSTM、CNN、Transformer、时间序列分类</dd>
    <dt>领域术语</dt>
    <dd>活动识别、时间序列、传感器数据、HAR</dd>
  </dl>
config: |
  <View>
      <!-- Control tag for region labels -->
      <TimeSeriesLabels name="label" toName="ts">
          <Label value="Run" background="red"/>
          <Label value="Walk" background="green"/>
          <Label value="Fly" background="blue"/>
          <Label value="Swim" background="#f6a"/>
          <Label value="Ride" background="#351"/>
      </TimeSeriesLabels>

      <!-- Object tag for time series data source -->
      <TimeSeries name="ts" valueType="url" value="$timeseriesUrl"
                  sep=","
                  timeColumn="time"
                  timeFormat="%Y-%m-%d %H:%M:%S.%f"
                  timeDisplayFormat="%Y-%m-%d"
                  overviewChannels="velocity">

          <Channel column="velocity"
                   units="miles/h"
                   displayFormat=",.1f"
                   strokeColor="#1f77b4"
                   legend="Velocity"/>

          <Channel column="acceleration"
                   units="miles/h^2"
                   displayFormat=",.1f"
                   strokeColor="#ff7f0e"
                   legend="Acceleration"/>
      </TimeSeries>
  </View>

