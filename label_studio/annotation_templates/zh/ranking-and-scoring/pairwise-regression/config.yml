title: "对比回归"
type: community
group: 排序与评分
image: /static/templates/pairwise-regression.png
details: <h1>在两个选项之间进行评分比较</h1>
config: |
  <View>
    <Header>Set how likely it is that these images represent the same thing:</Header>
