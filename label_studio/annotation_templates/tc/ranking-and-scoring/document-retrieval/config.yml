title: "文件檢索"
type: community
group: 排序與評分
image: /static/templates/document-retrieval.png
details: |
  <h1>評估和標註文件檢索結果</h1>
  <dl>
    <dt>產業應用</dt>
    <dd>搜尋引擎、推薦系統、企業搜尋、法律文件、研究文獻</dd>
    <dt>相關模型</dt>
    <dd>BERT、ColBERT、DPR</dd>
    <dt>領域術語</dt>
    <dd>檢索、搜尋、排序、資訊檢索、IR</dd>
  </dl>
config: |
  <View>
    <Text name="query" value="$query" />
    <Header value="Select document related to the query:" />
    <View style="display: flex">
      <View style="width:50%">
        <Text name="text1" value="$text1" />
        <Text name="text2" value="$text2" />
        <Text name="text3" value="$text3" />
      </View>
      <View>
        <Choices name="selection" toName="query" required="true" choice="multiple">
          <Choice value="One" />
          <Choice value="Two" />
          <Choice value="Two" />
        </Choices>
      </View>
    </View>
  </View>
