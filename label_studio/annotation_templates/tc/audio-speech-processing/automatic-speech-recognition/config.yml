title: "自動語音識別"
type: community
group: 音訊/語音處理
image: /static/templates/automatic-speech-recognition.png
details: |
  <h1>轉錄音訊內容</h1>
  <dl>
    <dt>產業應用</dt>
    <dd>播客轉錄、會議記錄、呼叫中心、客戶服務、無障礙、隱藏字幕、字幕、語音助手、聽寫、醫療聽寫、法律轉錄</dd>
    <dt>相關模型</dt>
    <dd>Whisper、Wav2Vec、DeepSpeech、transformer、CTC</dd>
    <dt>領域術語</dt>
    <dd>ASR、STT、語音轉文字、轉錄、語音識別、語音處理、音訊轉錄</dd>
  </dl>
config: |
  <View>
    <Audio name="audio" value="$audio" zoom="true" hotkey="ctrl+enter" />
    <Header value="Transcribe the audio" />
    <TextArea name="transcription" toName="audio"
              rows="4" editable="true" maxSubmissions="1" />
  </View>

