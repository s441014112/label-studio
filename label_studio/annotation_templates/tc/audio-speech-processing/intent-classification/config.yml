title: "意圖分類"
type: community
group: 音訊/語音處理
image: /static/templates/intent-classification.png
details: |
  <h1>對音訊中的使用者意圖進行分類</h1>
  <dl>
    <dt>產業應用</dt>
    <dd>語音助手、呼叫中心、客服機器人、對話AI</dd>
    <dt>相關模型</dt>
    <dd>BERT、Wav2Vec、HuBERT</dd>
    <dt>領域術語</dt>
    <dd>意圖識別、音訊分類、語音NLP、對話系統</dd>
  </dl>
config: |
  <View>
    <Labels name="labels" toName="audio">
      <Label value="Segment" />
    </Labels>

    <Audio name="audio" value="$audio"/>

    <Choices name="intent" toName="audio" perRegion="true" required="true">
      <Choice value="Question" />
      <Choice value="Request" />
      <Choice value="Satisfied" />
      <Choice value="Interested" />
      <Choice value="Unsatisfied" />
    </Choices>
  </View>
