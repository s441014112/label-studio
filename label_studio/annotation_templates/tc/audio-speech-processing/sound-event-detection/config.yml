title: "聲音事件檢測"
type: community
group: 音訊/語音處理
image: /static/templates/sound-event-detection.png
details: |
  <h1>在音訊中檢測和標註聲音事件</h1>
  <dl>
    <dt>產業應用</dt>
    <dd>環境監測、安全監控、智慧家居、工業檢測、野生動物監測</dd>
    <dt>相關模型</dt>
    <dd>PANNs、CRNN、YAMNet、AudioSet</dd>
    <dt>領域術語</dt>
    <dd>聲音事件、音訊檢測、聲學事件、SED</dd>
  </dl>
config: |
  <View>
    <Labels name="label" toName="audio" zoom="true" hotkey="ctrl+enter">
      <Label value="Event A" background="red"/>
      <Label value="Event B" background="green"/>
    </Labels>
    <Audio name="audio" value="$audio"/>
  </View>

