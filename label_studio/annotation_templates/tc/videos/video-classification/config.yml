title: "影片分類"
type: community
group: 影片
image: /static/templates/video-classification.png
details: |
  <h1>對影片進行分類標註</h1>
  <dl>
    <dt>產業應用</dt>
    <dd>內容審核、影片平台、媒體分析、安全監控、體育分析</dd>
    <dt>相關模型</dt>
    <dd>VideoMAE、TimeSformer、SlowFast、ViViT</dd>
    <dt>領域術語</dt>
    <dd>影片分類、動作識別、影片理解、媒體分析</dd>
  </dl>
config: |
  <View>
    <Video name="video" value="$video"/>
    <Choices name="choice" toName="video" showInLine="true">
      <Choice value="Blurry" />
      <Choice value="Sharp" />
    </Choices>
  </View>

