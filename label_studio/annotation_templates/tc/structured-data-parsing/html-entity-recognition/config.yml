title: "HTML 實體識別"
type: community
group: 結構化資料解析
image: /static/templates/html-entity-recognition.png
details: |
  <h1>從HTML文件中提取命名實體</h1>
  <dl>
    <dt>產業應用</dt>
    <dd>網頁抓取、資訊提取、內容聚合、電子商務、新聞聚合</dd>
    <dt>相關模型</dt>
    <dd>BERT、spaCy、LayoutLM</dd>
    <dt>領域術語</dt>
    <dd>HTML、NER、網頁解析、實體提取</dd>
  </dl>
config: |
  <View>
    <HyperTextLabels name="ner" toName="text">
      <Label value="Title" background="green"/>
      <Label value="Author" background="blue"/>
      <Label value="Body" background="yellow"/>
    </HyperTextLabels>

    <View style="border: 1px solid #CCC;
                 border-radius: 10px;
                 padding: 5px">
      <HyperText name="text" value="$html"/>
    </View>
  </View>

