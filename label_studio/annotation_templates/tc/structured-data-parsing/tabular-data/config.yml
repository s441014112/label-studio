title: "表格資料"
type: community
group: 結構化資料解析
image: /static/templates/tabular-data.png
details: |
  <h1>對表格資料進行標註和分類</h1>
  <dl>
    <dt>產業應用</dt>
    <dd>資料分析、資料庫標註、電子表格處理、資料清洗、商業智慧</dd>
    <dt>相關模型</dt>
    <dd>XGBoost、表格transformer、TabNet</dd>
    <dt>領域術語</dt>
    <dd>表格、結構化資料、表格標註、資料欄</dd>
  </dl>
config: |
  <View>
      <Header value="Table with {key: value} pairs"/>
      <Table name="table" value="$item"/>
      <Choices name="choice" toName="table">
          <Choice value="Correct"/>
          <Choice value="Incorrect"/>
      </Choices>
  </View>

