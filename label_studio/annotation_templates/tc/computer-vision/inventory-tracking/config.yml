title: "庫存追蹤"
type: community
group: 電腦視覺
image: /static/templates/inventory-tracking.png
details: |
  <h1>追蹤和標註庫存物品</h1>
  <dl>
    <dt>產業應用</dt>
    <dd>零售庫存、倉庫管理、供應鏈、物流、資產追蹤</dd>
    <dt>相關模型</dt>
    <dd>YOLO、EfficientDet、Faster R-CNN</dd>
    <dt>領域術語</dt>
    <dd>庫存管理、物品檢測、資產追蹤</dd>
  </dl>
config: |
  <View>
    <View style="display:flex;justify-content:center">
      <PolygonLabels name="objects" toName="image" value="$objects"/>
    </View>
    <Image name="image" value="$image"/>
  </View>
