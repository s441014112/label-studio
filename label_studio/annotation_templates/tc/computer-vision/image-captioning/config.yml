title: "圖片描述"
type: community
group: 電腦視覺
image: /static/templates/image-captioning.png
details: |
  <h1>為圖片新增描述性文字</h1>
  <dl>
    <dt>產業應用</dt>
    <dd>輔助功能、alt文字產生、社群媒體、內容管理、視覺問答、圖片搜尋</dd>
    <dt>相關模型</dt>
    <dd>BLIP、CLIP、OFA、Vision Transformer、CNN+RNN</dd>
    <dt>領域術語</dt>
    <dd>圖片描述、圖片標註、視覺語言、alt文字</dd>
  </dl>
config: |
  <View>
    <Image name="image" value="$captioning"/>
    <Header value="Describe the image:"/>
    <TextArea name="caption" toName="image" placeholder="Enter description here..."
              rows="5" maxSubmissions="1"/>
  </View>

