title: 問答系統
type: community
group: 自然語言處理
order: 1
image: /static/templates/question-answering.png
details: |
  <h1>基於上下文回答問題</h1>
  <dl>
    <dt>產業應用</dt>
    <dd>客戶支援自動化、教育評估、研究輔助、法律文件搜尋、醫療診斷支援、技術文件、FAQ自動化、知識庫搜尋、合規查詢、科學文獻搜尋、專利研究、保險索賠處理</dd>
    <dt>相關模型</dt>
    <dd>BERT-QA、RoBERTa、SQuAD、閱讀理解、抽取式QA、生成式QA</dd>
    <dt>領域術語</dt>
    <dd>NLP、span extraction、機器閱讀、資訊檢索、段落檢索、答案提取</dd>
  </dl>
config: |
  <View>
    <Header value="Please read the passage" />
    <Text name="text" value="$text" granularity="word"/>
    <Header value="Select a text span answering the following question:"/>
    <Text name="question" value="$question"/>

    <Labels name="answer" toName="text">
      <Label value="Answer" maxUsage="1" background="red"/>
    </Labels>

  </View>

